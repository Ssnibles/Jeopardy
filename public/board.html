<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy Main Screen Display</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="tv-mode-body">

  <header class="header-bar">
    <div class="brand">
      JEOPARDY! TV DISPLAY
    </div>
    <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
      <div id="tunnelBadge" class="tunnel-badge" style="display: none;" title="Click to copy public player link">
        <span class="tunnel-icon">🌐</span>
        <span class="tunnel-label">TUNNEL:</span>
        <span id="tunnelUrlText" class="tunnel-url"></span>
      </div>
      <div id="tvRoundBadge" class="room-badge" style="font-size: 1.15rem; background: rgba(251,191,36,0.2); color: var(--jeopardy-gold);">Jeopardy! Round</div>
      <div id="roomBadge" class="room-badge" style="font-size: 1.15rem;">ROOM: ----</div>
      <button id="btnFullscreen" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">Fullscreen</button>
      <button id="btnExitTV" class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">Exit TV Mode</button>
    </div>
  </header>

  <main class="container" style="max-width: 1400px; padding: 0 1rem; margin-top: 1rem;">

    <!-- JEOPARDY MAIN BOARD GRID -->
    <div id="tvBoard" class="jeopardy-board" style="min-height: 520px; gap: 1rem;">
      <!-- Rendered dynamically -->
    </div>

    <!-- BOTTOM PLAYER SCORE STRIP (INDIVIDUAL PLAYER CARDS FLOATING DIRECTLY ON TV BACKGROUND, HORIZONTALLY CENTRED) -->
    <div style="margin-top: 1.25rem; width: 100%; display: flex; justify-content: center; align-items: center;">
      <div id="tvScoreboard" class="scoreboard" style="width: 100%; max-width: 100%; border: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 0.75rem; padding: 0; margin: 0 auto;">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </main>

  <!-- FULLSCREEN CLUE OVERLAY FOR TV -->
  <div id="tvClueModal" class="clue-modal">
    <div class="clue-content" style="max-width: 1000px;">
      <div id="tvCategoryTitle" class="clue-category-title">Category</div>
      <div id="tvClueValue" class="clue-value-badge">$200</div>
      
      <!-- TV DAILY DOUBLE BANNER -->
      <div id="tvDailyDoubleBanner" class="daily-double-tv-banner" style="display: none;">
        DAILY DOUBLE
        <div id="tvDailyDoublePlayer" style="font-size: 1.25rem; font-weight: 700; margin-top: 0.25rem; color: #fff;"></div>
      </div>

      <div id="tvClueText" class="clue-text"></div>
      
      <img id="tvClueImage" src="" alt="" class="clue-image" style="display: none;">

      <div id="tvAnswerBox" class="clue-answer" style="display: none;">
        ANSWER: <span id="tvAnswerText"></span>
      </div>

      <!-- TV BUZZ ALERT POPUP -->
      <div id="tvBuzzAlert" style="display: none; margin-top: 1.5rem; background: var(--jeopardy-gold); color: #000; padding: 1rem 2.5rem; border-radius: var(--radius-full); font-size: 2rem; font-weight: 900; box-shadow: var(--shadow-lg); align-items: center; gap: 1rem;">
        <span><span id="tvBuzzPlayerName">Player</span> BUZZED IN!</span>
        <span id="tvAnswerTimerBadge" style="background: rgba(0,0,0,0.85); color: #ef4444; border-radius: 999px; padding: 0.2rem 0.8rem; font-size: 1.6rem; border: 2px solid #ef4444;">⌛ 7s</span>
      </div>
    </div>
  </div>

  <!-- TV COUNTDOWN OVERLAY -->
  <div id="tvCountdownOverlay" class="countdown-overlay">
    <div id="tvCountdownNum" class="countdown-num">3</div>
    <div class="countdown-label">BUZZERS UNLOCKING...</div>
  </div>

  <!-- TV WINSCREEN OVERLAY -->
  <div id="tvWinscreenModal" class="winscreen-modal">
    <div class="winscreen-card" style="max-width: 850px; border-width: 3px;">
      <div class="winner-crown">👑 🥇</div>
      <h1 class="winner-title" style="font-size: 3.5rem;">JEOPARDY CHAMPION!</h1>
      <div id="tvWinnerAvatar" class="winner-avatar-lg" style="width: 120px; height: 120px; font-size: 3.2rem;">?</div>
      <h2 id="tvWinnerName" style="font-size: 2.5rem; color: #fff; font-weight: 900;">Winner Name</h2>
      <div id="tvWinnerScore" class="winner-score-display" style="font-size: 3.8rem;">$0</div>

      <div style="width: 100%;">
        <h3 style="color: var(--text-muted); font-size: 1rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">FINAL STANDINGS</h3>
        <div id="tvPodiumStandings" class="podium-standings-grid" style="max-height: 320px;">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- TV FINAL JEOPARDY OVERLAY -->
  <div id="tvFJModal" class="clue-modal">
    <div class="clue-content" style="max-width: 1100px; text-align: center;">
      <div style="font-size: 1.6rem; color: var(--jeopardy-gold); font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.5rem;">🏆 FINAL JEOPARDY 🏆</div>
      <div id="tvFJCategory" class="clue-category-title" style="font-size: 2.5rem; margin-bottom: 1.5rem; text-transform: uppercase;">CATEGORY</div>
      
      <div id="tvFJStageMessage" style="font-size: 1.8rem; color: #ffffff; font-weight: 700; background: rgba(251,191,36,0.15); padding: 1rem 2rem; border-radius: var(--radius-md); border: 2px solid var(--jeopardy-gold); margin-bottom: 1.5rem;">
        Contestants are entering their secret wagers...
      </div>

      <div id="tvFJClueText" class="clue-text" style="display: none; font-size: 2.2rem; margin-bottom: 2rem;"></div>

      <div id="tvFJPlayerGrid" style="display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem;">
        <!-- Dynamically rendered contestant cards for FJ -->
      </div>
    </div>
  </div>

  <script src="/js/audio.js"></script>
  <script src="/js/board.js"></script>
</body>
</html>
