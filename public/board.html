<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy Main Screen Display</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/board.css">
</head>
<body class="tv-mode-body">

  <header class="header-bar">
    <a href="/" class="brand">
      <span class="brand-logo">JEOPARDY ARENA</span>
    </a>
    <div class="flex-row align-center gap-sm flex-wrap">
      <div id="tunnelBadge" class="tunnel-badge display-none" title="Click to copy public player link">
        <span class="tunnel-label">TUNNEL:</span>
        <span id="tunnelUrlText" class="tunnel-url"></span>
      </div>
      <div id="tvRoundBadge" class="room-badge tv-round-badge">Jeopardy! Round</div>
      <div id="roomBadge" class="room-badge">ROOM: ----</div>
      <button id="btnFullscreen" class="btn btn-icon" title="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button id="btnExitTV" class="btn btn-danger btn-icon" title="Exit TV Mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <main class="board-main">

    <!-- JEOPARDY MAIN BOARD GRID -->
    <div id="tvBoard" class="jeopardy-board">
      <!-- Rendered dynamically -->
    </div>

    <!-- BOTTOM PLAYER SCORE STRIP (INDIVIDUAL PLAYER CARDS FLOATING DIRECTLY ON TV BACKGROUND, HORIZONTALLY CENTRED) -->
    <div class="tv-scoreboard-container">
      <div id="tvScoreboard" class="scoreboard">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </main>

  <!-- FULLSCREEN CLUE OVERLAY FOR TV -->
  <div id="tvClueModal" class="clue-modal">
    <div class="clue-content">
      <div id="tvCategoryTitle" class="clue-category-title">Category</div>
      <div id="tvClueValue" class="clue-value-badge">$200</div>
      
      <!-- TV DAILY DOUBLE BANNER -->
      <div id="tvDailyDoubleBanner" class="daily-double-tv-banner display-none">
        DAILY DOUBLE
        <div id="tvDailyDoublePlayer" class="mt-xs text-white font-bold-700"></div>
      </div>

      <div id="tvClueText" class="clue-text"></div>
      
      <img id="tvClueImage" src="" alt="" class="clue-image display-none">

      <div id="tvAnswerBox" class="clue-answer display-none">
        ANSWER: <span id="tvAnswerText"></span>
      </div>

      <!-- TV BUZZ ALERT POPUP -->
      <div id="tvBuzzAlert" class="tv-buzz-alert display-none">
        <span><span id="tvBuzzPlayerName">Player</span> BUZZED IN!</span>
        <span id="tvAnswerTimerBadge" class="tv-answer-timer-badge">7s</span>
      </div>
    </div>
  </div>

  <!-- TV COUNTDOWN OVERLAY -->
  <div id="tvCountdownOverlay" class="countdown-overlay">
    <div id="tvCountdownNum" class="countdown-num">3</div>
    <div class="countdown-label">BUZZERS UNLOCKING...</div>
  </div>

  <!-- TV WINSCREEN OVERLAY -->
  <div id="tvWinscreenModal" class="winscreen-modal">
    <div class="winscreen-card tv-winscreen-card">
      <div class="winner-crown">CHAMPION</div>
      <h1 class="winner-title">JEOPARDY CHAMPION!</h1>
      <div id="tvWinnerAvatar" class="winner-avatar-lg">?</div>
      <h2 id="tvWinnerName" class="winner-name-text">Winner Name</h2>
      <div id="tvWinnerScore" class="winner-score-display">$0</div>

      <div class="podium-section">
        <h3 class="podium-title">FINAL STANDINGS</h3>
        <div id="tvPodiumStandings" class="podium-standings-grid">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- TV FINAL JEOPARDY OVERLAY -->
  <div id="tvFJModal" class="clue-modal">
    <div class="clue-content text-center">
      <div class="text-gold font-bold-900 mb-xs font-outfit">FINAL JEOPARDY</div>
      <div id="tvFJCategory" class="clue-category-title mb-lg">CATEGORY</div>
      
      <div id="tvFJStageMessage" class="glass-panel text-white font-bold-700 mb-lg">
        Contestants are entering their secret wagers...
      </div>

      <div id="tvFJClueText" class="clue-text display-none mb-lg"></div>

      <div id="tvFJPlayerGrid" class="flex-row gap-xl flex-center flex-wrap mt-lg">
        <!-- Dynamically rendered contestant cards for FJ -->
      </div>
    </div>
  </div>

  <script src="/js/audio.js"></script>
  <script src="/js/board.js"></script>
</body>
</html>
